<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Create Organisation — Cloud Cost Analyzer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --accent:      oklch(0.55 0.22 264);
      --accent-2:    oklch(0.48 0.23 264);
      --accent-soft: oklch(0.55 0.22 264 / .10);
      --accent-ring: oklch(0.55 0.22 264 / .25);
      --accent-fg:   #ffffff;

      --bg:          #f8fafc;
      --panel:       #f1f5f9;
      --surface:     #ffffff;
      --surface-2:   #f8fafc;

      --border:      oklch(0.88 0.01 264 / .8);
      --border-soft: oklch(0.92 0.008 264 / .7);

      --text:        oklch(0.20 0.015 264);
      --text-muted:  oklch(0.45 0.02 264);
      --text-dim:    oklch(0.60 0.015 264);

      --ok:          oklch(0.58 0.18 152);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: "Manrope", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(12px, 2vh, 24px);
      -webkit-font-smoothing: antialiased;
      position: relative;
    }

    /* Ambient background grid */
    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(var(--border-soft) 1px, transparent 1px),
        linear-gradient(90deg, var(--border-soft) 1px, transparent 1px);
      background-size: 36px 36px;
      -webkit-mask-image: radial-gradient(ellipse at 50% 30%, #000 0%, transparent 80%);
      mask-image: radial-gradient(ellipse at 50% 30%, #000 0%, transparent 80%);
      opacity: .85;
      pointer-events: none;
    }

    .card {
      position: relative;
      z-index: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: clamp(20px, 3.2vh, 32px) clamp(20px, 3.5vw, 36px);
      width: 100%;
      max-width: 440px;
      box-shadow: 0 20px 40px -15px rgba(15, 23, 42, 0.07), 0 1px 3px rgba(0, 0, 0, 0.04);
      box-sizing: border-box;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: clamp(10px, 1.8vh, 18px);
      justify-content: center;
    }

    .logo__img {
      height: 38px;
      width: auto;
      max-width: 170px;
      object-fit: contain;
      flex-shrink: 0;
      display: block;
    }

    .logo-text {
      font-size: 15.5px;
      font-weight: 800;
      color: var(--text);
      letter-spacing: -.2px;
    }

    .logo-sub {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-dim);
      margin-top: 1px;
    }

    h1 {
      font-size: clamp(20px, 2.2vw, 24px);
      font-weight: 800;
      color: var(--text);
      text-align: center;
      letter-spacing: -.5px;
      margin-bottom: 4px;
    }

    .subtitle {
      font-size: 13px;
      color: var(--text-muted);
      text-align: center;
      margin-bottom: clamp(10px, 1.8vh, 16px);
    }

    .badges {
      display: flex;
      gap: 6px;
      justify-content: center;
      margin-bottom: clamp(12px, 1.8vh, 18px);
    }

    .badge {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 3px 10px;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .badge__dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
    }
    .badge__dot--azure { background: var(--accent); }
    .badge__dot--aws   { background: #f59e0b; }
    .badge__dot--gcp   { background: var(--ok); }

    .form-group {
      margin-bottom: clamp(8px, 1.3vh, 12px);
    }

    label {
      display: block;
      font-size: 10.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .07em;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    input {
      width: 100%;
      min-height: 38px;
      height: 38px;
      padding: 8px 12px;
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 9px;
      color: var(--text);
      font-family: inherit;
      font-size: 13.5px;
      outline: none;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.03);
      transition: border-color .15s, box-shadow .15s;
    }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-ring);
    }

    input::placeholder {
      color: var(--text-dim);
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .btn {
      width: 100%;
      min-height: 40px;
      height: 40px;
      padding: 0 14px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      border: none;
      border-radius: 9px;
      color: var(--accent-fg);
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: -.1px;
      cursor: pointer;
      box-shadow: 0 4px 12px var(--accent-ring);
      transition: filter .15s, transform .1s;
      margin-top: clamp(6px, 1vh, 10px);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn:hover {
      filter: brightness(1.06);
    }

    .btn:active {
      transform: scale(.99);
    }

    .btn:disabled {
      filter: brightness(.85);
      cursor: not-allowed;
    }

    .signin-link {
      text-align: center;
      font-size: 12.5px;
      color: var(--text-muted);
      margin-top: clamp(10px, 1.5vh, 16px);
    }

    .signin-link a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 700;
    }

    .signin-link a:hover {
      text-decoration: underline;
    }

    .error {
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 8px;
      padding: 8px 12px;
      color: #dc2626;
      font-size: 12px;
      line-height: 1.45;
      margin-bottom: 10px;
      display: none;
    }

    .terms {
      font-size: 11px;
      color: var(--text-dim);
      text-align: center;
      margin-top: clamp(8px, 1.2vh, 12px);
      line-height: 1.4;
    }

    .terms a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
    }

    .terms a:hover {
      text-decoration: underline;
    }

    @media (max-height: 680px) {
      .badges { display: none; }
      .logo { margin-bottom: 6px; }
      .subtitle { margin-bottom: 10px; }
      .card { padding: 16px 24px; }
    }
  </style>
</head>
<body>
<div class="card">
  <div class="logo">
    <img class="logo__img" src="{{ url_for('static', filename='img/truetec-logo.png') }}" alt="Truetec Logo" />
  </div>

  <h1>Create your organisation</h1>
  <p class="subtitle">Start your free trial — no credit card required</p>

  <div class="badges">
    <div class="badge"><span class="badge__dot badge__dot--azure"></span> Azure</div>
    <div class="badge"><span class="badge__dot badge__dot--aws"></span> AWS</div>
    <div class="badge"><span class="badge__dot badge__dot--gcp"></span> GCP</div>
  </div>

  <div class="error" id="error-msg"></div>

  <form id="signup-form">
    <div class="form-group">
      <label for="org_name">Organisation Name</label>
      <input type="text" id="org_name" placeholder="Acme Corp" required autocomplete="organization"/>
    </div>
    <div class="row">
      <div class="form-group">
        <label for="first_name">First Name</label>
        <input type="text" id="first_name" placeholder="Jane" required autocomplete="given-name"/>
      </div>
      <div class="form-group">
        <label for="last_name">Last Name</label>
        <input type="text" id="last_name" placeholder="Smith" required autocomplete="family-name"/>
      </div>
    </div>
    <div class="form-group">
      <label for="email">Work Email</label>
      <input type="email" id="email" placeholder="jane@acme.com" required autocomplete="email"/>
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Min 8 characters" required autocomplete="new-password"/>
    </div>
    <button type="submit" class="btn" id="submit-btn">Create Account &rarr;</button>
    <p class="terms">By creating an account you agree to our <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>.</p>
  </form>

  <div class="signin-link">Already have an account? <a href="/login">Sign in</a></div>
</div>

<script>
document.getElementById('signup-form').addEventListener('submit', async function(e) {
  e.preventDefault();
  const btn = document.getElementById('submit-btn');
  const errEl = document.getElementById('error-msg');
  errEl.style.display = 'none';
  btn.disabled = true;
  btn.textContent = 'Creating account…';

  const payload = {
    org_name: document.getElementById('org_name').value.trim(),
    first_name: document.getElementById('first_name').value.trim(),
    last_name: document.getElementById('last_name').value.trim(),
    email: document.getElementById('email').value.trim(),
    password: document.getElementById('password').value
  };

  try {
    const res = await fetch('/api/signup', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    if (res.ok && data.success) {
      window.location.href = '/onboarding';
    } else {
      errEl.textContent = data.error || 'Signup failed. Please try again.';
      errEl.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Create Account →';
    }
  } catch (err) {
    errEl.textContent = 'Network error. Please try again.';
    errEl.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Create Account →';
  }
});
</script>
</body>
</html>
